<!DOCTYPE html>
<html>
    <!-- Page to display a profile. logged in user or other user -->
    <head>
        <title>Coffeeshop | Profile</title>
        <meta charset="utf-8" />
        <meta name="viewport" width="device-width, inital-scale=1.0" />
        <meta name="description" content="Profile page for Anna and Michely's Web Programming Project"/>

        <link rel="stylesheet" href="css/styles.css" />

        <!-- import functions from JS files here -->
         
        <script type="module">
             import {App }from "./js/profile.js";

             new App();
      </script>
    </head>
    <body>
        <div class="wrapper">

            <header>
                <div style="display:flex;">
                    <a href=""><img class="navbar-icon" src="images/website-logo.png" /></a>
                    <h1>Coffeeshop</h1>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="profile.html">My Profile</a></li>
                        <li><a href="settings.html">Settings</a></li>
                    </ul>
                </nav>
            </header>
            
            <main class="profile-page">
                <!-- display user information, other functionality from this page? check proposal -->
                <div class="profile-header">
                    <img class="profile-pic" src="images/blank-pfp.png" /> 
                    <div>
                        <!-- Use id to display usename/name from server-->
                        <h2 id = "profileDisplayName">Anna</h2> 
                        <h3 id = "profileDisplayUsername">username</h3>
                    </div>
                </div>
                <!-- Most recent post -->
                <div class="profile-box">
                    <h3>Recommendation</h3>
                    <div class="box-body">
                        <p>[Put a post in here]</p>
                    </div>
                </div>

                
                <div style="display:flex; justify-content:safe;"> 
                    <!-- connect section -->
                    <div>
                        <div class="profile-box">
                            <h3>Connect</h3>
                            <div class="box-body connect-list">
                                <p><img src="./images/spotify-logo.png" alt="Spotify Logo" class="icon"> <a href="https://open.spotify.com/user/p67if9fyyrtwwjbopqhm9pul7?si=6f12bb6be17a4811">Spotify</a></p>
                                <p><img src="./images/letterboxd-logo.png" alt="Letterboxd Logo" class="icon"> <a href="https://open.spotify.com/user/p67if9fyyrtwwjbopqhm9pul7?si=6f12bb6be17a4811">Letterboxd</a></p>
                                <p><img src="./images/blank-pfp.png" alt="Goodreads Logo" class="icon"> <a href="https://open.spotify.com/user/p67if9fyyrtwwjbopqhm9pul7?si=6f12bb6be17a4811">GoodReads</a></p>
                                <p><img src="./images/instagram-logo.png" alt="instagram logo" class="icon"><a href="https://www.instagram.com/">Instagram</a> </p>
                            </div>
                        </div>
                    </div>
                    <!-- Friends -->
                    <div class="profile-box">
                        <h3>Friends</h3>
                        <div class="box-body friends-list">
                            <ul class="friends-list">
                                <li>Michely</li>
                                <li>Jane</li>
                                <li>Joe</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="profile-box">
                    <h3>generic section</h3>
                    <div class="box-body">
                        <p>box text here</p>
                    </div>
                </div>

            </main>
            <footer>

            </footer>
        </div>
    </body>
</html>
