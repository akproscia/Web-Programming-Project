<!DOCTYPE html>
<html>
    <!-- Page to display a profile. logged in user or other user -->
    <head>
        <title>Coffeeshop | Profile</title>
        <meta charset="utf-8" />
        <meta name="viewport" width="device-width, inital-scale=1.0" />
        <meta name="description" content="Profile page for Anna and Michely's Web Programming Project"/>

        <link rel="stylesheet" href="css/styles.css" />

        <!-- import functions from JS files here -->
         
        <script type="module">
            import { App }from "./js/profile.js";
            import PostsApp from "./js/posts.js";

            new App();
            new PostsApp();
            
      </script>
    </head>
    <body>
        <header>
            <div style="display:flex;">
                <a href=""><img class="navbar-icon" src="images/website-logo.png" /></a>
                <h1>Coffeeshop</h1> 
            </div>
            <div class="nav-and-username-div">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="profile.html" id="header-username-link"></a></li>
                        <li><a href="settings.html">Settings</a></li>
                    </ul>
                </nav>
                <h3 id="header-username" class="header-username" ></h3>
            </div>
        </header>
        <div class="wrapper">
            <main class="profile-page">
                <!-- display user information, other functionality from this page? check proposal -->
                <div class="profile-header">
                    <!--default blank pfp, if user has not selected from the options-->
                    <img src="images/blank-pfp.png" class="profile-pic" alt="Profile Picture" width="80" height="80">
                    <div>
                        <!-- Use id to display usename/name from server-->
                        <h2 id = "profileDisplayName">Anna</h2> 
                        <h3 id = "profileDisplayUsername">username</h3>
                    </div>
                </div>
                <!-- Most recent post 
                <div class="profile-box">
                    <h3>Recommendation</h3>
                    <div class="box-body">
                        <p>[Put a post in here]</p>
                    </div>
                </div>
            -->
                
                <!-- post container div, posts will be displayed in here. this will be referenced in the js file by #post-container -->
                <div class="post-container" id="post-container">
                    <div class="post-controls">
                        <!-- Search aligned left -->
                        <input type="text" id="search-posts" class="post-search" placeholder="Search posts..." />
     
                        <div class="post-controls-right">
                            <!-- Filter + Sort--grouped together -->
                            <form id="filter-posts-form">
                                <select class="styled-select" id="filter-posts">
                                    <option value="all">Filter: All</option>
                                    <option value="show">Filter: Shows</option>
                                    <option value="movie">Filter: Movies</option>
                                    <option value="book">Filter: Books</option>
                                    <option value="game">Filter: Game</option>
                                    <option value="music">Filter: Music</option>
                                    <option value="other">Filter: Other</option>
                                </select>
                            </form>
                            <form id="sort-posts-form">
                                <select class="styled-select" id="sort-posts">
                                    <option value="newest">Sort: Newest</option>
                                    <option value="oldest">Sort: Oldest</option>
                                    <option value="alpha">Sort: A-Z</option>
                                </select>
                            </form>
                        </div>
                        
                    </div> 
                    <div id="posts-list">
                        <!-- Posts will be dynamically inserted here by JS -->
                    </div>
                </div>

            </main>
            <footer>

            </footer>
        </div>
    </body>
</html>
