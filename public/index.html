<!DOCTYPE html>
<html>
    <head>
        <title>Coffeeshop | Home</title>
        <meta charset="utf-8" />
        <meta name="viewport" width="device-width, initial-scale=1.0" />
        <meta name="description" content="Home page for Anna and Michely's Web Programming Project"/>

        <link rel="stylesheet" href="css/styles.css" />

        <!-- import functions from JS files here -->
        <script type="module">
            import App from "./js/posts.js";

            const app = new App();
        </script>
    </head>
    <body>
        

            <header>
                <div style="display:flex;">
                    <a href=""><img class="navbar-icon" src="images/website-logo.png" /></a>
                    <h1>Coffeeshop</h1> 
                </div>
                <div class="nav-and-username-div">
                    <nav>
                        <ul>
                            <li><a href="index.html">Home</a></li>
                            <li><a href="profile.html" id="header-username-link"></a></li>
                            <li><a href="settings.html">Settings</a></li>
                        </ul>
                    </nav>
                    <h3 id="header-username" class="header-username" ></h3>
                </div>
            </header>
            <div class="wrapper">
                <main>
                    <!-- display posts, other functionality from this page? check proposal -->
                    <!-- "Add something" button/box on top -->

                    <section id="new-post-section">

                        <div>
                            <h2>Add a New Post!</h2>
                        </div>

                        <form id="add-post">

                            <div class="form-element">
                                <label class="form-label" for="post-title">Title</label>
                                <input class="form-text" type="text" id="post-title" placeholder="Enter post title..." />
                            </div>

                            <div class="form-element">
                                <label class="form-label" for="media-type">Media Type</label>
                                <select class="form-select" id="media-type">
                                    <option value="show">Show</option>
                                    <option value="movie">Movie</option>
                                    <option value="book">Book</option>
                                    <option value="game">Game</option>
                                    <option value="music">Song or Artist</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div class="form-element">
                                <label class="form-label" for="post-body">What did you think?</label>
                                <!-- Changed to Textarea so user can resize  -->
                                <textarea class="form-text" id="post-body" placeholder="More about this..." ></textarea>  
                            </div>

                            <div class="form-element">
                                <button class="post-button" type="submit" id="submit-post">Post</button>
                            </div>
                        </form>
                    </section>

                    <br>

                    <div>
                        <h2>My Posts</h2>
                        <div style="display:flex; justify-content:space-between">
                            <!-- refresh and sort posts button -->
                            <button class="form-button" id="refresh-posts">Refresh Posts</button>
                            <div style="display:flex; justify-content:flex-end; align-content: bottom;">
                                <!-- Filter posts by type-->
                                <form id="filter-posts-form">
                                    <label for="filter-posts">Filter </label>
                                    <select class="form-select" id="filter-posts">
                                        <option value="all">All</option>
                                        <option value="show">Shows</option>
                                        <option value="movie">Movies</option>
                                        <option value="book">Books</option>
                                        <option value="game">Game</option>
                                        <option value="music">Music</option>
                                        <option value="other">Other</option>
                                    </select>
                                </form>
                                <!-- Sort posts by date -->
                                <form id="sort-posts-form">
                                    <label for="sort-posts">Sort</label>
                                    <select class="form-select" id="sort-posts">
                                        <option value="newest">Newest</option>
                                        <option value="oldest">Oldest</option>
                                    </select>
                                </form>
                            </div>
                            
                        </div>
                    </div>
                        
                    

                    <!-- post container div, posts will be displayed in here. this will be referenced in the js file by #post-container -->
                    <div class="post-container" id="post-container">
                        <!-- Posts will be dynamically inserted here by JS -->
                    </div>

                </main>
            </div>
            <footer>

            </footer>
    </body>
</html>
