<!DOCTYPE html>
<html>
    <!-- Login Page. needs form to submit username and password -->
    <head>
        <title>Coffeeshop | Login</title>
        <meta charset="utf-8" />
        <meta name="viewport" width="device-width, inital-scale=1.0" />
        <meta name="description" content="Login page for Anna and Michely's Web Programming Project"/>

        <link rel="stylesheet" href="/css/styles.css" />

        <!-- import functions from JS files here -->
        <script type="module">
            import setup from "./js/login.js";
            setup();

        </script>
    </head>
    <body>
        <div class="wrapper">
         
            <header>
                <div style="display:flex;">
                    <a href=""><img class="navbar-icon" src="images/website-logo.png" /></a>
                    <h1>Coffeeshop</h1>
                </div>                     
            </header>
            
            <main>
                <!-- Login page, needs form to submit username and password. other functionality from this page? check proposal -->

                <div>
                    <h2>Welcome Back!</h2>
                </div>

                <form>
                        <div class="form-error hidden" id="error-message">
                        <p>Invalid Username or Password</p>
                        </div>

                    <div class="form-element">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-text" type="text" name="username" id="username" />
                    </div>
                    <div class="form-element">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-text" type="password" name="password" id="password" />
                    </div>
                     <div class="form-element">
                        <button class="login-button" type="button" id="login">Login</button>
                     </div>

                     <div class="form-element">
                     <p>Don't Have An Account? <a href="register.html" id="register-link">Register Here!</a></p>
                     </div>
                </form>

            </main>
            <footer>

            </footer>
        </div>
    </body>
</html>
