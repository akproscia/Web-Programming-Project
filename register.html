<!DOCTYPE html>
<html>
    <!-- Register Page. -->
    <head>
        <title>Coffeeshop | Registration</title>
        <meta charset="utf-8" />
        <meta name="viewport" width="device-width, inital-scale=1.0" />
        <meta name="description" content="Register page for Anna and Michely's Web Programming Project"/>

        <link rel="stylesheet" href="css/styles.css" />

        <!-- import functions from JS files here -->
        <script type="module">
            import setup from "./js/register.js";
            setup();

        </script>
    </head>
    <body>
        <div class="wrapper">
            <header>
                <div style="display:flex;">
                    <a href=""><img class="navbar-icon" src="images/website-logo.png" /></a>
                    <h1>Coffeeshop</h1>
                </div>
            </header> 
            <main>
                <div>
                    <h2>Register</h2>
                </div>

                <!-- Register page needs form to submit display name, username, email, choice of pfp, and password. other functionality from this page? check proposal -->
               <form>

                    <div class="form-error hidden" id="error-message">
                        <p>Passwords do not match</p>
                    </div>

                    <!--form-->
                    <strong>    
                    <div class="form-element">
                        <label class="form-label" for="displayName">Display Name</label>
                        <input class="form-text" type="text" id="displayName" />
                     </div> 

                
                    <div class="form-element">
                        <label class="form-label" for="username">Enter Username</label>
                        <input class="form-text" type="text" id="username" />
                    </div>
                    
                    
                    <div class="form-element">
                        <label class="form-label" for="password">Enter Password</label>
                        <input class="form-text" type="password" id="password" />
                    </div>
                     
                    
                    <div class="form-element">
                        <label class="form-label" for="passwordConfirmed">Enter Password Again</label>
                        <input class="form-text" type="password" id="passwordConfirmed" />
                    </div>
                    </strong>

                     <p>Your Profile Picture</p>
                     <img src="images\blank-pfp.png" alt="Profile Picture" width="80" height="80/">
                   
                     <div class="form-element">
                        <button class="register-button" type="button" id="register">Register</button>
                    </div>
                    
                    <div class="form-element">
                     <p>Already Have An Account? <a href="login.html" id="login-link">Log In Here!</a></p>
                     </div>
                </form>
                
            </main>
            <footer>

            </footer>
        </div>
    </body>
</html>
